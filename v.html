<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>충전 요청서 — 오피노</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="share.css">
<style>
.doc{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:22px 20px}
.doc .to{color:var(--sub);font-size:13px;margin:0 0 4px}
.doc h1{margin:0 0 16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 0;border-top:1px solid var(--rule);vertical-align:top}
tr:first-child th,tr:first-child td{border-top:0}
th{width:118px;color:var(--sub);font-weight:500}
td{font-weight:600}
td.amt{font-size:19px}
.foot2{color:var(--sub);font-size:12.5px;margin-top:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="doc" id="doc"><p class="to">드림인사이트 귀중</p><h1>충전 요청서</h1><div id="body">요청 내용이 없습니다.</div></div>
  <p class="foot2">오피노 비즈머니에서 보낸 요청입니다. 문의는 드림인사이트 x 오피노 단톡방으로 부탁드립니다.</p>
</main>
<script>
(function () {
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var dec = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); };
  var W = '일월화수목금토';
  var day = function (d) { var m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d || ''); if (!m) return esc(d); var t = new Date(+m[1], +m[2] - 1, +m[3]); return (+m[2]) + '월 ' + (+m[3]) + '일(' + W[t.getDay()] + ')'; };
  var when = function (ms) { var t = new Date(+ms); if (isNaN(t)) return ''; var p = function (n) { return (n < 10 ? '0' : '') + n; }; return t.getFullYear() + '.' + p(t.getMonth() + 1) + '.' + p(t.getDate()) + ' ' + p(t.getHours()) + ':' + p(t.getMinutes()); };
  var el = document.getElementById('body'), q = location.search;
  try {
    var md = /[?&]d=([^&#]+)/.exec(q), mt = /[?&]t=([^&#]+)/.exec(q);
    if (md) {
      var x = JSON.parse(dec(md[1]));
      // 새 형식 {items:[[브랜드,계정명,ID,충전일,금액],...], by, at} / 예전 형식 {b,n,i,d,a,by,at}
      var accs = Array.isArray(x.items) ? x.items.map(function (a) { return { b: a[0], n: a[1], i: a[2], d: a[3], a: a[4] }; }) : [x];
      var tbl = function (a) {
        var rows = [['브랜드', esc(a.b)], ['매체', '네이버 검색광고'], ['광고계정ID', esc(a.n)], ['AdAccontNo', esc(a.i)],
          ['충전 요청 금액', '<span class="amt">' + Number(a.a).toLocaleString('ko-KR') + '원</span>'], ['충전 날짜', day(a.d) + '까지']];
        return '<table>' + rows.map(function (r) { return '<tr><th>' + r[0] + '</th><td' + (r[0] === '충전 요청 금액' ? ' class="amt"' : '') + '>' + r[1] + '</td></tr>'; }).join('') + '</table>';
      };
      el.innerHTML = accs.map(tbl).join('<div style="height:14px;border-bottom:2px solid var(--rule);margin-bottom:14px"></div>') +
        '<table style="margin-top:14px"><tr><th>요청</th><td>오피노' + (x.by ? ' ' + esc(x.by) : '') + (x.at ? ' · ' + when(x.at) : '') + '</td></tr></table>';
      document.title = '충전 요청서 — ' + accs.map(function (a) { return a.b; }).join(', ');
    } else if (mt) { el.innerHTML = '<pre>' + esc(dec(mt[1])) + '</pre>'; }
  } catch (e) { el.textContent = '요청 내용을 읽지 못했습니다.'; }
})();
</script>
</body>
</html>
