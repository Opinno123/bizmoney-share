<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>오피노 충전 요청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="share.css">
</head>
<body>
<main class="wrap">
  <h1>오피노 충전 요청</h1>
  <div class="card"><pre id="t">요청 내용이 없습니다.</pre><div class="row"><button class="btn kk" id="c">요청 내용 복사</button><span class="st" id="s"></span></div></div>
</main>
<script>
(function () {
  var m = /[?&]t=([^&#]+)/.exec(location.search), el = document.getElementById('t'), st = document.getElementById('s'), txt = '';
  try { if (m) { var s = m[1].replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; txt = decodeURIComponent(escape(atob(s))); el.textContent = txt; } } catch (e) { el.textContent = '요청 내용을 읽지 못했습니다.'; }
  document.getElementById('c').onclick = function () {
    if (!txt) return;
    var ok = function () { st.className = 'st ok'; st.textContent = '복사했습니다.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () { st.textContent = '글을 길게 눌러 복사해 주세요.'; });
    else st.textContent = '글을 길게 눌러 복사해 주세요.';
  };
})();
</script>
</body>
</html>
